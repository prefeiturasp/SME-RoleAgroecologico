<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <style>
            body { font-family: Arial, sans-serif; color: #333; }
            .container { max-width: 700px; margin: 0 auto; padding: 30px; background-color: #f9f9f9; border: 1px solid #ddd; box-sizing: border-box; }
            .espaco { padding-top: 18px; }
            .lista { line-height: 1.7rem; }
            .destaque { font-weight: 600; color: #87AE27; font-size: 1rem; margin-top: 30px; }
            .rodape { margin-top: 5rem; }
            .rodape .destaque { color: #005C2C; }
            .rodape img { margin-right: 5px; padding: 1.2rem 0; max-width: 15%; }
        </style>
    </head>
    <body>
        <div class="container">
            {CONTEUDO}
            <div class="rodape">
                <p class="destaque">Atenciosamente,<br>Equipe Rolê Agroecológico</p>
                <div id="logomarcas">{IMAGENS_RODAPE}</div>
            </div>
        </div>
    </body>
</html>
